<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rounded square background -->
  <rect x="20" y="20" width="160" height="160" rx="30" ry="30" fill="#E5C36A"/>

  <!-- Trophy icon in brown -->
  <g transform="translate(100, 100)">
    <!-- Trophy cup -->
    <path d="M -35 -25 L -30 10 L 30 10 L 35 -25 Z" fill="#8B6914" stroke="#6B4423" stroke-width="2"/>

    <!-- Trophy handles -->
    <path d="M -35 -20 Q -45 -15 -45 -5 Q -45 5 -35 5" fill="none" stroke="#6B4423" stroke-width="3"/>
    <path d="M 35 -20 Q 45 -15 45 -5 Q 45 5 35 5" fill="none" stroke="#6B4423" stroke-width="3"/>

    <!-- Trophy base -->
    <rect x="-25" y="10" width="50" height="8" fill="#6B4423"/>
    <rect x="-30" y="18" width="60" height="6" fill="#6B4423"/>
    <rect x="-35" y="24" width="70" height="8" rx="2" fill="#6B4423"/>
  </g>
</svg>
