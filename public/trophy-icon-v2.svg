<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rounded square background -->
  <rect x="20" y="20" width="160" height="160" rx="30" ry="30" fill="#E5C36A"/>

  <!-- Trophy icon - simplified style matching lucide -->
  <g transform="translate(100, 100)" stroke="#8B6914" stroke-width="3" fill="none">
    <!-- Trophy cup -->
    <path d="M -20 -25 L -20 -5 Q -20 10 0 10 Q 20 10 20 -5 L 20 -25 Z" stroke-linejoin="round"/>

    <!-- Left handle -->
    <path d="M -20 -20 L -28 -20 Q -32 -20 -32 -12 Q -32 -4 -28 -4 L -20 -4" stroke-linecap="round"/>

    <!-- Right handle -->
    <path d="M 20 -20 L 28 -20 Q 32 -20 32 -12 Q 32 -4 28 -4 L 20 -4" stroke-linecap="round"/>

    <!-- Trophy stem -->
    <line x1="0" y1="10" x2="0" y2="22" stroke-linecap="round"/>

    <!-- Trophy base -->
    <line x1="-15" y1="22" x2="15" y2="22" stroke-linecap="round"/>
    <line x1="-12" y1="28" x2="12" y2="28" stroke-linecap="round"/>
  </g>
</svg>
